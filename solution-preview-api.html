<!doctype html><head><link rel="stylesheet" href="api-material.css"><style>html,body{margin:0!important;padding:0!important;background:transparent!important;overflow:hidden!important}.preview-root{position:absolute;width:800px;height:640px;transform-origin:top left}</style><style>.integration-visual{position:absolute!important;inset:70px 16px!important;width:768px!important;height:500px!important;padding:0!important;border:0!important;box-shadow:none!important;background:none!important}.integration-visual svg{width:100%;height:100%;overflow:visible} </style><style>.preview-root{width:1100px!important;height:560px!important}.integration-visual{inset:25px 15px!important;width:1070px!important;height:510px!important}.integration-visual svg{width:100%;height:100%}</style><link rel="icon" type="image/svg+xml" href="assets/bridgify-octopus-icon.svg"></head><body><div class="preview-root"><div class="integration-visual"><svg viewBox="-65 25 1230 310" role="img" aria-labelledby="integration-title"><title id="integration-title">Attractions, activities and tours connect through one Bridgify API to your product</title><defs><filter id="api-material-depth" x="-50%" y="-50%" width="200%" height="230%"><feDropShadow dx="0" dy="2" stdDeviation="0" flood-color="#78472e"/><feDropShadow dx="0" dy="5" stdDeviation="0" flood-color="#382217"/><feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#130c09"/><feDropShadow dx="0" dy="14" stdDeviation="5" flood-color="#000" flood-opacity=".7"/></filter><filter id="api-flow-glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="api-photo-clip"><rect x="799.09" y="110" width="241.82" height="100" rx="9"/></clipPath><linearGradient id="tile" x2="1" y2="1"><stop stop-color="#383032"/><stop offset="1" stop-color="#100e0f"/></linearGradient><linearGradient id="hub" x2="1" y2="1"><stop stop-color="#382727"/><stop offset="1" stop-color="#180f10"/></linearGradient></defs><g fill="none" stroke="#f46649" stroke-width="1.5"><path id="api-route-0" d="M131.3 96 C330 96 390 180 502.5 180"/><path id="api-route-1" d="M131.3 180 H502.5"/><path id="api-route-2" d="M131.3 264 C330 264 390 180 502.5 180"/><path id="api-route-3" d="M637.5 180 H893.4"/><circle class="api-wave" cx="570" cy="180" r="90" opacity="0"/><circle class="api-wave" cx="570" cy="180" r="90" opacity="0"/><circle class="api-wave" cx="570" cy="180" r="90" opacity="0"/></g><g transform="translate(-52 36) scale(.78 .8)"><g fill="url(#tile)" stroke="#eeaa82" stroke-width="1" filter="url(#api-material-depth)"><rect x="35" y="45" width="200" height="60" rx="9"/><rect x="35" y="150" width="200" height="60" rx="9"/><rect x="35" y="255" width="200" height="60" rx="9"/></g></g><g transform="translate(-52 36) scale(.78 .8)"><g stroke="#f46649" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M74 95V68H103V95M69 95H108M81 76H86V81H81ZM92 76H97V81H92ZM81 86H86V91H81ZM92 86H97V91H92Z" transform="translate(-19 -6)"/><path d="M89 185L94 199L108 204L94 209L89 223L84 209L70 204L84 199Z" transform="translate(-19 -24)"/><path d="M78 342V303L108 314L78 325" transform="translate(-4.4 27) scale(.8)"/></g></g><g transform="translate(-52 36) scale(.78 .8)"><g fill="#fff8f1" stroke="#f46649" stroke-width="1"><circle cx="83.0" cy="87.0" r="3"/><circle cx="74.0" cy="176.0" r="3"/><circle cx="58" cy="269.4" r="3"/></g></g><g fill="#c9ad9d" font-family="Sofia, sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle"><text x="30" y="100.0" text-anchor="start" font-size="10">ATTRACTIONS</text><text x="30" y="184.0" text-anchor="start" font-size="10">ACTIVITIES</text><text x="30" y="268.0" text-anchor="start" font-size="10">TOURS</text><text x="570" y="260" font-size="9">ONE INTEGRATION</text><text x="1008" y="300" font-size="9">YOUR PRODUCT</text></g><g id="api-stream" fill="#fff8f1" stroke="#f46649" stroke-width=".7" filter="url(#api-flow-glow)"><circle class="api-particle" r="2.8" opacity="0"/><circle class="api-particle" r="2.67" opacity="0"/><circle class="api-particle" r="2.54" opacity="0"/><circle class="api-particle" r="2.41" opacity="0"/><circle class="api-particle" r="2.28" opacity="0"/><circle class="api-particle" r="2.15" opacity="0"/><circle class="api-particle" r="2.02" opacity="0"/><circle class="api-particle" r="1.89" opacity="0"/><circle class="api-particle" r="1.76" opacity="0"/></g><g transform="translate(142.5 45) scale(.75)"><rect id="api-hub-face" x="480" y="105" width="180" height="150" rx="15" fill="url(#hub)" stroke="#d9876c" stroke-width="1"/></g><g transform="translate(142.5 45) scale(.75)"><text x="570" y="190" text-anchor="middle" fill="#fff8f1" font-family="Chillax,sans-serif" font-size="30">API</text></g><g transform="translate(253.8 32.4) scale(.82)"><g><rect id="api-arrival-glow" x="780" y="70" width="280" height="220" rx="13" fill="none" stroke="#ffad80" opacity="0" stroke-width="3" filter="url(#api-flow-glow)"/><rect id="api-product-face" x="780.0" y="70" width="280.0" height="220" rx="13" fill="url(#tile)" stroke="#eeaa82" stroke-width=".7"/><path d="M781 99H1059" stroke="#f4a17b55"/><g fill="#f46649"><circle cx="799.0909090909091" cy="85" r="2"/><circle cx="809.2727272727273" cy="85" r="2"/><circle cx="819.4545454545455" cy="85" r="2"/></g><g clip-path="url(#api-photo-clip)"><image id="api-photo-base" href="assets/api-hotel.png" x="799.0909090909091" y="110" width="241.8181818181818" height="100" preserveAspectRatio="xMidYMid slice"/><image id="api-photo-next" href="assets/api-hotel.png" x="799.0909090909091" y="110" width="241.8181818181818" height="100" preserveAspectRatio="xMidYMid slice" opacity="0"/></g><rect x="799.0909090909091" y="223" width="165.45454545454547" height="4" rx="2" fill="#87756a"/><rect x="799.0909090909091" y="234" width="120.9090909090909" height="3" rx="2" fill="#c6b8a8"/><rect x="799.0909090909091" y="246" width="241.8181818181818" height="27" rx="6" fill="#180f10"/><text x="920.0" y="263" fill="#fff8f1" text-anchor="middle" font-family="Sofia,sans-serif" font-size="11">Explore experiences ↗</text></g></g><circle cx="502.5" cy="180" r="3" fill="#fff3df" stroke="#eeaa82" stroke-width="1" filter="url(#api-flow-glow)"/><g fill="none" stroke="#ffc39b55" stroke-width=".7" pointer-events="none"><rect x="39" y="49" width="192" height="52" rx="6" transform="translate(-52 36) scale(.78 .8)"/><rect x="39" y="154" width="192" height="52" rx="6" transform="translate(-52 36) scale(.78 .8)"/><rect x="39" y="259" width="192" height="52" rx="6" transform="translate(-52 36) scale(.78 .8)"/><rect x="485" y="110" width="170" height="140" rx="10" transform="translate(142.5 45) scale(.75)"/><rect x="786.36" y="75" width="267.27" height="210" rx="9" transform="translate(253.8 32.4) scale(.82)"/></g></svg></div></div><script>
(()=>{
 const root=document.querySelector('.integration-visual');
 const routes=[0,1,2,3].map(i=>document.getElementById('api-route-'+i)), lengths=routes.map(p=>p.getTotalLength());
 const dots=[...root.querySelectorAll('.api-particle')],waves=[...root.querySelectorAll('.api-wave')];
 const hub=document.getElementById('api-hub-face'),product=document.getElementById('api-product-face');
 const arrival=document.getElementById('api-arrival-glow');
 const base=document.getElementById('api-photo-base'),next=document.getElementById('api-photo-next');
 const photos=['assets/api-hotel.png','assets/api-concert.png','assets/api-attraction.png'];
 const motion=matchMedia('(prefers-reduced-motion: reduce)');
 let frame=0,elapsed=0,last=0,visible=false,cycle=-1,active=0;
 const clamp=x=>Math.max(0,Math.min(1,x));
 const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
 function position(dot,route,t,alpha){const p=routes[route].getPointAtLength(lengths[route]*clamp(t));dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);dot.setAttribute('opacity',alpha)}
 function reset(){dots.forEach(d=>d.setAttribute('opacity','0'));waves.forEach(w=>w.setAttribute('opacity','0'));hub.style.filter='';product.style.filter='';arrival.setAttribute('opacity','0');hub.setAttribute('stroke','#d9876c');product.setAttribute('stroke','#c9b7a5')}
 function tick(now){frame=0;if(!visible||document.hidden||motion.matches){last=0;return}if(last)elapsed+=Math.min(now-last,60);last=now;
 const turn=Math.floor(elapsed/5300),t=elapsed%5300;
 if(turn!==cycle){cycle=turn;active=(turn+1)%3;next.setAttribute('href',photos[active]);next.setAttribute('opacity','0')}
 reset();
 dots.forEach((dot,i)=>{const local=t-i*90;
 if(local>=0&&local<1600){const u=local/1600;position(dot,active,smooth(u),Math.min(1,u*10)*(1-i*.065))}
 // The stream travels behind the opaque API body before emerging on its right.
 else if(local>=1600&&local<2150){position(dot,3,0,0)}
 else if(local>=2150&&local<3050){const u=(local-2150)/900;position(dot,3,u,(1-i*.065)*Math.min(1,(1-u)*12))}
 });
 waves.forEach((wave,i)=>{const u=(t-1450-i*180)/1300;if(u>=0&&u<=1){wave.setAttribute('r',74+48*(1-Math.pow(1-u,3)));wave.setAttribute('opacity',String(.38*Math.sin(Math.PI*u)*(1-u)));wave.style.filter='drop-shadow(0 0 3px #f4664966)'}});
 const energy=clamp((t-1400)/350)*(1-smooth((t-2200)/600));
 if(energy>0){hub.setAttribute('stroke','#f46649')}
 if(t>=3050){const u=clamp((t-3050)/620);next.setAttribute('opacity',String(smooth(u)));if(u===1)base.setAttribute('href',photos[active]);const glow=Math.sin(Math.PI*clamp((t-3050)/850));arrival.setAttribute('opacity',String(glow*.95));
   product.style.filter=glow>0?'drop-shadow(0 0 '+(glow*16)+'px #f46649)':'';
   product.setAttribute('stroke',t<3900?'#ffd3b0':'#c9b7a5')}
 frame=requestAnimationFrame(tick)}
 function resume(){if(frame)cancelAnimationFrame(frame);frame=0;last=0;if(visible&&!document.hidden&&!motion.matches)frame=requestAnimationFrame(tick);else reset()}
 new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;resume()},{threshold:.1}).observe(root);
 document.addEventListener('visibilitychange',resume);motion.addEventListener('change',resume);
 photos.forEach(src=>{const im=new Image();im.src=src});
})();
</script><script>function fitAPI(){const e=document.querySelector('.preview-root'),scale=Math.min((innerWidth-35)/1100,(innerHeight-35)/560);e.style.transform='translate('+((innerWidth-1100*scale)/2)+'px,'+((innerHeight-560*scale)/2)+'px) scale('+scale+')'}addEventListener('resize',fitAPI);fitAPI();</script></body>
