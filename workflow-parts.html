<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bridgify · חלקי הטוטוריאל</title><style>body{margin:0;padding:40px 5vw;background:#180f10;color:#eee9de;font:18px/1.5 system-ui}h1{font-size:32px;font-weight:500}p{color:#eee9de}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button,a{font:inherit;border:1px solid #f4664970;padding:10px 16px;border-radius:8px;background:#ffffff08;color:#eee9de;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#f46649;color:#180f10}section{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px}article{border:1px solid #f4664940;border-radius:14px;padding:22px;background:linear-gradient(130deg,#ffd1ae0c,transparent)}h2{font-size:21px;margin:0 0 8px}article p{font-size:15px;margin-bottom:22px}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions a,.actions button{font-size:14px}iframe{display:block;width:100%;height:620px;border:0;margin-top:28px;border-radius:14px;background:#211719}#status{font-size:14px;min-height:24px}@media(max-width:760px){section{grid-template-columns:1fr}iframe{height:650px}}</style><h1>הטוטוריאל — 7 אנימציות לשילוב באתר</h1><p>שבעה פרקים עצמאיים לפי הסרטון, ובנוסף אנימציה מלאה שמנגנת את כולם לפי הסדר. בחר לייט או דארק, צפה והעתק קוד הטמעה לסקשן הרצוי.</p><nav><button id="dark" aria-pressed="true">דארק</button><button id="light" aria-pressed="false">לייט</button><a id="full" href="workflow-preview.html?version=2&theme=dark">הטוטוריאל המלא ↗</a></nav><section id="parts"></section><p id="status" role="status"></p><iframe title="תצוגה מקדימה של חלק הטוטוריאל" loading="lazy"></iframe><script>
const scenes=[['Search','חיפוש יעד, הצעות והפעלת החיפוש.','part=search'],['City Page','עמוד עיר, קטגוריות, מזג אוויר ורשימת החוויות.','part=city'],['Tickets','פרטי חוויה, גלריה, בחירת תאריך, שעה וכמות כרטיסים.','part=tickets'],['Cart','אישור הוספה לסל וסיכום ההזמנה.','part=cart'],['Checkout','פרטי המשלם והמבקרים, עד המעבר לתשלום.','part=checkout'],['Just Ask','AIyelet בתוך עמוד החוויות: הקלדה והמלצות.','part=ask'],['Build It In','בקשת API והצגת התשובה.','part=build']];let theme='dark',selected=0;const url=i=>'workflow-preview.html?version=2&embed=1&view=screen&theme='+theme+'&'+scenes[i][2];function render(){document.querySelector('#parts').innerHTML=scenes.map((s,i)=>`<article><h2>${s[0]}</h2><p>${s[1]}</p><div class="actions"><a href="${url(i)}" target="_blank">פתח חלק ↗</a><button data-preview="${i}">הצג כאן</button><button data-copy="${i}">העתק קוד הטמעה</button></div></article>`).join('');document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.preview);document.querySelector('iframe').src=url(selected)});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const code=`<iframe src="${url(Number(b.dataset.copy))}" title="Bridgify product tutorial" loading="lazy" style="width:100%;height:650px;border:0;border-radius:12px"></iframe>`;try{await navigator.clipboard.writeText(code);document.querySelector('#status').textContent='קוד ההטמעה הועתק.'}catch{document.querySelector('#status').textContent=code}});document.querySelector('#full').href='workflow-preview.html?version=2&theme='+theme;document.querySelector('iframe').src=url(selected)}['dark','light'].forEach(t=>document.querySelector('#'+t).onclick=()=>{theme=t;['dark','light'].forEach(x=>document.querySelector('#'+x).setAttribute('aria-pressed',String(x===t)));render()});render();</script></html>
