<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bridgify — Connected supply</title><style>
@font-face{font-family:Chillax;src:url('Chillax_Complete/Fonts/WEB/fonts/Chillax-Regular.woff2')}@font-face{font-family:Sofia;src:url('Sofia_Sans/SofiaSans-VariableFont_wght.ttf')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080706}svg{display:block;width:100%;height:100%}text{font-family:Sofia,sans-serif;fill:#eee9de}.label{font-size:16px}.micro{font-size:11px;letter-spacing:1.6px;fill:#fff8f1}.title{font:24px Chillax,sans-serif}.wire{fill:none;stroke:url(#cable);stroke-width:3}.under{fill:none;stroke:#f46649;stroke-width:8;opacity:.10;filter:url(#soft)}.packet{fill:#fff8f1;stroke:#f46649;stroke-width:.7;filter:url(#glow)}button{position:absolute;right:14px;bottom:12px;border:1px solid #eee9de30;border-radius:20px;background:#180f10;color:#eee9de;font:11px Sofia;padding:5px 10px;cursor:pointer}button:focus-visible{outline:2px solid #f46649}
</style></head><body><svg viewBox="0 0 800 450" role="img" aria-labelledby="scene-title scene-desc"><title id="scene-title"></title><desc id="scene-desc"></desc><defs>
<linearGradient id="panel" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#513a33"/><stop offset=".35" stop-color="#30201e"/><stop offset="1" stop-color="#201415"/></linearGradient>
<linearGradient id="edge" x2="0" y2="1"><stop stop-color="#98644e"/><stop offset="1" stop-color="#281917"/></linearGradient>
<linearGradient id="cable" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="340"><stop stop-color="#ffbd9a"/><stop offset=".4" stop-color="#f46649"/><stop offset="1" stop-color="#ac432f"/></linearGradient>
<radialGradient id="ambient"><stop stop-color="#f46649" stop-opacity=".07"/><stop offset="1" stop-color="#080706" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-30%" y="-30%" width="170%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#000" flood-opacity=".7"/></filter><filter id="soft"><feGaussianBlur stdDeviation="2"/></filter><filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="2"/><feComposite in="SourceGraphic"/></filter><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".75" fill="#f46649" opacity=".09"/></pattern></defs><rect width="800" height="450" fill="#080706"/><ellipse cx="440" cy="280" rx="370" ry="220" fill="url(#ambient)"/><path d="M0 340L800 300V450H0Z" fill="url(#dots)"/><g id="scene"></g></svg><button aria-label="Pause animation">Pause Ⅱ</button><script>
const connected=new URLSearchParams(location.search).get('mode')==='connected';
const svg=document.querySelector('#scene');
document.querySelector('#scene-title').textContent=connected?'With Bridgify: one connected supply layer':'Building it yourself: fragmented supplier connections';
document.querySelector('#scene-desc').textContent=connected?'Tours, attractions, activities and events flow through Bridgify into your product.':'Separate supplier connections stall before reaching your product.';
let out='';
const ys=[112,183,254,325], names=['Tours','Attractions','Activities','Events'];
const brandIcons=["<g transform=\"scale(.72) translate(-36 -65)\" fill=\"none\" stroke=\"#f46649\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><path d=\"M25 78V50l22 10-22 10\"/></g>", "<g transform=\"scale(.72) translate(-36 -150)\" fill=\"none\" stroke=\"#f46649\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><path d=\"M22 142h28v19H22zM28 142l3-5h9l3 5\"/><circle cx=\"36\" cy=\"151\" r=\"5\"/></g>", "<g transform=\"scale(.72) translate(-36 -225)\" fill=\"none\" stroke=\"#f46649\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><path d=\"M24 234l7-13 8 3 9-10M30 241l8-13 11 9\"/><circle cx=\"35\" cy=\"211\" r=\"3\"/></g>", "<g transform=\"scale(.72) translate(-36 -305)\" fill=\"none\" stroke=\"#f46649\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><path d=\"M23 302h27M30 290v9M43 290v9\"/><rect x=\"23\" y=\"294\" width=\"27\" height=\"25\" rx=\"3\"/></g>"];
const paths=connected?ys.map(y=>`M208 ${y} C270 ${y} 270 218 328 218`):['M208 112 C294 112 275 171 371 171','M208 183 C280 183 310 285 420 285','M208 254 C282 254 290 119 400 119','M208 325 C294 325 255 138 448 145'];
paths.forEach((d,i)=>{out+=`<path class="under" d="${d}"/><path id="route${i}" class="wire" d="${d}"/>`;if(!connected){out+=`<path d="M${[387,436,416,464][i]} ${[171,285,119,145][i]} C510 ${ys[i]} 510 ${ys[i]} 576 218" fill="none" stroke="#f46649" opacity=".15" stroke-width="1.4" stroke-dasharray="4 7"/>`;}});
if(connected)out+='<path class="under" d="M488 218H576"/><path id="delivery" class="wire" d="M488 218H576"/>';
ys.forEach((y,i)=>{out+=`<g filter="url(#shadow)"><rect x="40" y="${y-23}" width="168" height="52" rx="10" fill="url(#edge)"/><rect x="40" y="${y-28}" width="168" height="52" rx="10" fill="url(#panel)" stroke="#f46649" stroke-opacity=".6"/><g transform="translate(62 ${y-2})">${brandIcons[i]}</g><text class="label" x="78" y="${y+4}">${names[i]}</text><circle cx="208" cy="${y}" r="3" fill="#f46649"/></g>`;});
if(connected){out+='<g filter="url(#shadow)"><rect x="328" y="161" width="160" height="126" rx="15" fill="url(#edge)"/><rect x="328" y="153" width="160" height="126" rx="15" fill="url(#panel)" stroke="#f46649"/><text class="title" x="408" y="209" text-anchor="middle">Bridgify</text><text class="micro" x="408" y="237" text-anchor="middle">ONE CONNECTION</text></g>';}else{out+='';}
out+='<g filter="url(#shadow)"><rect x="576" y="136" width="184" height="174" rx="12" fill="url(#edge)"/><rect x="576" y="128" width="184" height="174" rx="12" fill="url(#panel)" stroke="#eee9de" stroke-opacity=".3"/><path d="M592 158H744" stroke="#eee9de" opacity=".15"/><circle cx="594" cy="143" r="2" fill="#f46649"/><circle cx="602" cy="143" r="2" fill="#f46649"/><circle cx="610" cy="143" r="2" fill="#f46649"/><text class="micro" x="596" y="184">YOUR PRODUCT</text>';
for(let i=0;i<3;i++)out+=`<rect x="596" y="${200+i*26}" width="144" height="17" rx="4" fill="${connected?'#eee9de':'#180f10'}" opacity="${connected?'.9':'.5'}"/><circle class="receipt" cx="606" cy="${208+i*26}" r="3" fill="#f46649" opacity="${connected?1:.2}"/>`;
if(!connected)out+='<text x="668" y="282" text-anchor="middle" style="font-size:14px;fill:#fff8f1">No experiences received</text>';
else out+='<text x="668" y="282" text-anchor="middle" style="font-size:14px;fill:#fff8f1">Ready to book</text>';
out+='</g>';
if(!connected){[[371,171],[420,285],[400,119],[448,145]].forEach(([x,y])=>{out+=`<g class="blocked" transform="translate(${x} ${y})"><circle r="9" fill="#271513" stroke="#f46649" stroke-width="1.5"/><path d="M-3 -3L3 3M3 -3L-3 3" stroke="#fff8f1" stroke-width="1.5"/></g>`;});}

out+=`<text class="micro" x="40" y="52">${connected?'CONNECTED SUPPLY':'FRAGMENTED SUPPLY'}</text><text x="40" y="409" style="font-size:15px;fill:#fff8f1">${connected?'One contract. One integration. One schema.':'Multiple contracts. Multiple APIs. Ongoing maintenance.'}</text>`;
paths.forEach((d,i)=>{for(let n=0;n<4;n++)out+=`<circle class="packet" data-route="${i}" data-phase="${n/4}" r="3.4"/>`;});
if(connected)out+='<circle class="packet" data-route="delivery" data-phase="0" r="3.4"/><circle class="packet" data-route="delivery" data-phase="0.5" r="3.4"/>';
svg.innerHTML=out;
const packets=[...svg.querySelectorAll('.packet')].map(el=>{const path=svg.querySelector(el.dataset.route==='delivery'?'#delivery':'#route'+el.dataset.route);return{el,path,length:path.getTotalLength(),phase:+el.dataset.phase};});
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,visible=true,time=0,last=0;const button=document.querySelector('button');function label(){button.textContent=paused?'Play ▷':'Pause Ⅱ';button.setAttribute('aria-label',paused?'Play animation':'Pause animation');}label();button.onclick=()=>{paused=!paused;label();};
new IntersectionObserver(e=>{visible=e[0].isIntersecting;}).observe(document.body);
function draw(t){if(last&&visible&&!paused&&!document.hidden)time+=Math.min(t-last,50);last=t;packets.forEach(({el,path,length,phase})=>{let f=(time/4200+phase)%1;let p=connected?f:Math.min(f/.48,1-phase*.12);let point=path.getPointAtLength(p*length);el.setAttribute('cx',point.x);el.setAttribute('cy',point.y);el.style.opacity=connected?1:f>.94?Math.max(0,(1-f)/.06):1;});
if(connected)svg.querySelectorAll('.receipt').forEach((el,i)=>{const pulse=(time/2100+i/3)%1;el.setAttribute('r',pulse<.22?4.2:3);el.setAttribute('fill',pulse<.22?'#b64a34':'#f46649');});
requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></body></html>
