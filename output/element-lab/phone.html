<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#100A08">
<title>Bridgify · תצוגת טלפון</title>
<style>
html,body{margin:0;height:100%;background:#100A08;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#100A08}
.ph-pill{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:10;display:flex;align-items:center;gap:2px;padding:3px;
  border:1px solid #F4664999;border-radius:12px;background:#160F0DE6;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  font:600 13px/1 -apple-system,system-ui,sans-serif;box-shadow:0 6px 20px #0008}
.ph-pill button{min-height:36px;padding:0 11px;border:0;border-radius:9px;background:none;color:#C7B5A5;font:inherit;cursor:pointer}
.ph-pill button[aria-pressed="true"]{background:#F46649;color:#180F10}
.ph-pill .ph-min{color:#9b8b80;padding:0 9px}
.ph-pill.is-min button:not(.ph-min){display:none}
</style>
</head>
<body>
<iframe id="f" title="Bridgify"></iframe>
<div class="ph-pill" id="pill" role="group" aria-label="תצוגה">
  <button type="button" data-m="prop" aria-pressed="true">מוצע</button>
  <button type="button" data-m="base" aria-pressed="false">היום</button>
  <button type="button" class="ph-min" aria-label="מזער" id="min">–</button>
</div>
<script>
/* Real-device preview: the live page fills the phone screen, so media queries, touch and the address bar behave for real.
   "מוצע" adds the adaptive layer on every page you open from inside; "היום" shows the site as it is. */
(() => {
  const f = document.getElementById('f'), pill = document.getElementById('pill');
  const q = new URLSearchParams(location.search);
  let mode = q.get('mode') === 'base' ? 'base' : 'prop';
  const start = q.get('page') || 'index-v2.html';
  const url = p => '../../' + (p === 'index-v2.html' ? '' : p) + (p.includes('?') ? '&' : '?') + 'version=2';
  const pageName = doc => { const n = doc.location.pathname.split('/').pop().replace('.html', ''); return n || 'index-v2'; };
  const inject = doc => {
    if (doc.documentElement.dataset.adLayer) return;
    doc.documentElement.dataset.adLayer = '1';
    const base = new URL('adaptive/', location.href).href, n = pageName(doc);
    ['layout.css', 'patterns.css', `pages/${n}.css`].forEach(x => { const l = doc.createElement('link'); l.rel = 'stylesheet'; l.href = base + x + '?t=' + Date.now(); doc.head.appendChild(l); });
    const s = ['patterns.js', `pages/${n}.js`];
    const next = i => { if (i >= s.length) return; const e = doc.createElement('script'); e.src = base + s[i] + '?t=' + Date.now(); e.onload = e.onerror = () => next(i + 1); doc.body.appendChild(e); };
    next(0);
  };
  f.addEventListener('load', () => {
    let doc; try { doc = f.contentDocument; } catch (e) { return; }
    if (!doc) return;
    document.title = doc.title || 'Bridgify';
    if (mode === 'prop') inject(doc);
  });
  const go = () => {
    pill.querySelectorAll('[data-m]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === mode)));
    let cur = start;
    try { const l = f.contentWindow.location; if (l.pathname) cur = (l.pathname.split('/').pop() || 'index-v2.html') + l.hash; } catch (e) {}
    f.src = url(cur.split('#')[0]) + (cur.includes('#') ? '#' + cur.split('#')[1] : '');
  };
  pill.addEventListener('click', e => {
    const b = e.target.closest('[data-m]');
    if (b && b.dataset.m !== mode) { mode = b.dataset.m; go(); }
  });
  document.getElementById('min').addEventListener('click', e => { const m = pill.classList.toggle('is-min'); e.target.textContent = m ? '⇄' : '–'; });
  f.src = url(start);
})();
</script>
</body>
</html>
