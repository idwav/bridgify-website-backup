<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>גריד · תצוגה חיה</title>
<style>
:root{--bg:#100A08;--panel:#1A1210;--line:#3a2c27;--ink:#EEE9DE;--muted:#9b8b80;--coral:#F46649}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 14px/1.3 -apple-system,system-ui,sans-serif;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.grp b{color:var(--muted);font-weight:600;margin-inline-end:4px}
.grp button{min-height:32px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--ink);font:inherit;cursor:pointer}
.grp button[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#180F10}
.ver button{min-height:38px;padding:0 16px;font-size:15px;font-weight:700}
.grp[hidden]{display:none}
.info{margin-inline-start:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{height:calc(100% - var(--bar-h,54px));display:flex;justify-content:center;align-items:flex-start}
.frame{position:relative;overflow:hidden;background:#000}
.frame iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:#fff}
.lines{position:absolute;inset:0;pointer-events:none}
.lines i{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--coral);opacity:.85}
.flash{position:fixed;top:calc(var(--bar-h,54px) + 16px);left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:10px;background:var(--coral);color:#180F10;font:700 18px/1 -apple-system,system-ui,sans-serif;opacity:0;transition:opacity .25s;pointer-events:none}
.flash.on{opacity:1}
</style>
</head>
<body>
<div class="bar" id="bar">
  <div class="grp ver"><b>גרסה</b>
    <button data-v="1440">A · עד 1440</button>
    <button data-v="1560">B · עד 1560</button>
    <button data-v="today">היום</button>
  </div>
  <div class="grp"><b>ריווח</b>
    <button data-s="0">היום</button>
    <button data-s="1">שלב 3 (טיוטה)</button>
  </div>
  <div class="grp"><b>רוחב</b>
    <button data-w="fit">המסך שלי</button>
    <button data-w="768">768</button><button data-w="1024">1024</button><button data-w="1440">1440</button>
    <button data-w="1920">1920</button><button data-w="2560">2560</button>
  </div>
  <div class="grp" id="gt"><b>שוליים בטאבלט</b><button data-t="32">32</button><button data-t="40">40</button></div>
  <div class="grp"><b>קו</b><button data-l="1">מוצג</button><button data-l="0">מוסתר</button></div>
  <div class="info" id="info"></div>
</div>
<div class="stage" id="stage">
  <div class="frame" id="frame"><iframe id="f" title="Bridgify homepage"></iframe><div class="lines" id="lines"></div></div>
</div>
<div class="flash" id="flash"></div>
<script>
(() => {
  /* Lab only. One full screen of the real homepage. Switching A / B / today swaps only the injected CSS
     (try-cap.css), so the page stays where you scrolled. Keys: A, B, T (today), or ← → to flip. */
  const q = new URLSearchParams(location.search);
  const S = { v: q.get('v') || '1560', w: q.get('w') === 'fit' ? 'fit' : +(q.get('w') || 1920), t: +(q.get('t') || 32), l: q.get('l') !== '0', s: q.get('s') === '1' };
  const NAME = { today: 'היום', 1440: 'A · תוכן עד 1440', 1560: 'B · תוכן עד 1560' };
  const ORDER = ['1440', '1560', 'today'];
  const f = document.getElementById('f'), frame = document.getElementById('frame'), lines = document.getElementById('lines'), stage = document.getElementById('stage');
  let css = '', W = 0, spTok = '', spCode = '';
  fetch('try-cap.css', { cache: 'no-store' }).then(r => r.text()).then(t => { css = t; inject(); });
  Promise.all(['tokens-wide.css', 'roles-index-v2.js', 'rhythm-wide.js'].map(u => fetch(u, { cache: 'no-store' }).then(r => r.text())))
    .then(([t, roles, eng]) => { spTok = t; spCode = roles + '\n' + eng; spacing(); });
  // step 3: tablet/desktop spacing tokens + the role-map engine, run inside the page; off = cleared back to today
  function spacing() {
    let d, w; try { d = f.contentDocument; w = f.contentWindow; } catch (e) { return; }
    if (!d || !d.head || !d.body || !spTok || d.URL === 'about:blank') return;
    let st = d.getElementById('try-space');
    if (!S.s) { if (st) st.remove(); if (w.BridgifyRhythmWide) w.BridgifyRhythmWide.clear(); return; }
    if (!st) { st = d.createElement('style'); st.id = 'try-space'; st.textContent = spTok; d.head.appendChild(st); }
    if (!w.BridgifyRhythmWide) { const sc = d.createElement('script'); sc.textContent = spCode; d.body.appendChild(sc); }
    else requestAnimationFrame(() => w.BridgifyRhythmWide.apply());
  }

  const margin = () => {
    if (S.v === 'today' || W <= 599) return null;
    if (W <= 1023) return S.t;
    return Math.max(Math.min(Math.max(40, 0.04 * W), 64), (W - +S.v) / 2);
  };
  function inject() {
    let d; try { d = f.contentDocument; } catch (e) { return; }
    if (!d || !d.head) return;
    let st = d.getElementById('try-cap');
    if (S.v === 'today') { if (st) st.remove(); return; }
    if (!st) { st = d.createElement('style'); st.id = 'try-cap'; d.head.appendChild(st); }
    st.textContent = css + `\nhtml:root{--try-cap:${S.v}px;--try-tab:${S.t}px}`;
  }
  function layout() {
    document.documentElement.style.setProperty('--bar-h', document.getElementById('bar').offsetHeight + 'px');
    const availW = stage.clientWidth, availH = stage.clientHeight;
    if (availW < 50 || availH < 50) return;  // hidden tab: wait for the next resize
    W = S.w === 'fit' ? availW : +S.w;
    const s = Math.min(1, availW / W);
    frame.style.width = W * s + 'px'; frame.style.height = availH + 'px';
    f.style.width = W + 'px'; f.style.height = availH / s + 'px'; f.style.transform = `scale(${s})`;
    const m = margin();
    let sb = 0; try { const d = f.contentDocument; sb = d && d.documentElement.clientWidth ? W - d.documentElement.clientWidth : 0; } catch (e) {}
    lines.innerHTML = (S.l && m != null) ? `<i style="left:${m * s}px"></i><i style="left:${(W - sb - m) * s}px"></i>` : '';
    document.getElementById('info').innerHTML = `<bdi>${W}px</bdi>` + (m != null ? ` · שוליים ${Math.round(m)}` : '') + (s < 1 ? ` · מוקטן ל־${Math.round(s * 100)}%` : '');
    document.getElementById('gt').hidden = !(W >= 600 && W <= 1023);
    document.querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.v));
    document.querySelectorAll('[data-w]').forEach(b => b.setAttribute('aria-pressed', b.dataset.w === String(S.w)));
    document.querySelectorAll('[data-t]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.t === S.t));
    document.querySelectorAll('[data-s]').forEach(b => b.setAttribute('aria-pressed', (b.dataset.s === '1') === S.s));
    document.querySelectorAll('[data-l]').forEach(b => b.setAttribute('aria-pressed', (b.dataset.l === '1') === S.l));
    history.replaceState(null, '', '?' + new URLSearchParams({ v: S.v, w: S.w, t: S.t, l: S.l ? 1 : 0, s: S.s ? 1 : 0 }));
  }
  let ft;
  function setVersion(v) {
    if (v === S.v) return; S.v = v; inject(); layout(); spacing();
    const el = document.getElementById('flash'); el.textContent = NAME[v]; el.classList.add('on');
    clearTimeout(ft); ft = setTimeout(() => el.classList.remove('on'), 900);
  }
  document.getElementById('bar').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.v) return setVersion(b.dataset.v);
    if (b.dataset.s) { S.s = b.dataset.s === '1'; layout(); spacing(); return; }
    if (b.dataset.w) S.w = b.dataset.w === 'fit' ? 'fit' : +b.dataset.w;
    if (b.dataset.t) { S.t = +b.dataset.t; inject(); spacing(); }
    if (b.dataset.l) S.l = b.dataset.l === '1';
    layout();
  });
  function keys(e) {
    const k = e.key.toLowerCase();
    if (k === 'a' || k === 'ש') setVersion('1440');
    else if (k === 'b' || k === 'נ') setVersion('1560');
    else if (k === 't' || k === 'א') setVersion('today');
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { const i = ORDER.indexOf(S.v); setVersion(ORDER[(i + (e.key === 'ArrowLeft' ? 1 : 2)) % 3]); e.preventDefault(); }
  }
  addEventListener('keydown', keys);
  f.addEventListener('load', () => { inject(); layout(); spacing(); try { f.contentWindow.addEventListener('keydown', keys); } catch (e) {} });
  addEventListener('resize', layout);
  f.src = '../../../index-v2.html?version=2';
  layout();
})();
</script>
</body>
</html>
