<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bridgify — שלוש חלופות ללוקליזציה</title><style>*{box-sizing:border-box}body{margin:0;background:#eee9de;color:#eee9de;font:16px Arial,sans-serif}header{background:#180f10;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}nav{display:flex;gap:10px;flex-wrap:wrap}button,a{font:inherit;color:inherit;border:1px solid #f4664970;background:#2c1c1b;border-radius:9px;padding:11px 15px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#f46649;color:#180f10}small{color:#dac6bb}#description{padding:14px 28px;background:#2b1d1b;margin:0;line-height:1.5}iframe{display:block;width:100%;height:calc(100vh - 145px);min-height:650px;border:0}button:focus-visible,a:focus-visible{outline:2px solid #fff8f1;outline-offset:3px}@media(max-width:700px){iframe{height:100vh}header{padding:16px}nav{gap:6px}button{font-size:14px}}</style></head><body><header><div>Bridgify · חלופות ללוקליזציה<br><small>סקיצות לבחירה — האתר הראשי לא השתנה</small></div><nav aria-label="חלופות עיצוב"><button data-option="1" aria-pressed="true">1 · שלושה שווקים במבט אחד</button><button data-option="2" aria-pressed="false">2 · סטודיו למותג</button><button data-option="3" aria-pressed="false">3 · מותג אחד, בכל מכשיר</button></nav><a id="open" href="option-1.html" target="_blank">פתיחה בנפרד ↗</a></header><p id="description">אותה חנות בשלושה שווקים במקביל: רואים מיד מה נשאר זהה ומה משתנה בשפה ובמטבע.</p><iframe id="preview" title="תצוגת חלופת עיצוב" src="option-1.html"></iframe><script>const descriptions={1:'אותה חנות בשלושה שווקים במקביל: רואים מיד מה נשאר זהה ומה משתנה בשפה ובמטבע.',2:'שלוש לשוניות מעל במה אחת: מותג, שוק וערוץ. הבחירה משנה את החנות ומדגישה את השינוי.',3:'אתר גדול ברקע, אפליקציה בחזית ופורטל בצד. בחירת שוק מעדכנת את שלושת הערוצים יחד.'};document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const n=b.dataset.option;document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('preview').src='option-'+n+'.html';document.getElementById('open').href='option-'+n+'.html';document.getElementById('description').textContent=descriptions[n]});</script></body></html>
